name: PR

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not one of the default activity types, so a draft PR would never
    # re-evaluate the required build gate once it is marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      # The shared workflow defaults to the 10.0.x SDK, but this repository targets net11.0 and pins
      # the .NET 11 SDK in global.json. Without the matching SDK the runner cannot resolve global.json
      # ("A compatible .NET SDK was not found") and every step fails.
      # Keep in sync with `sdk.version` in global.json.
      dotnet-version: "11.0.100-rc.1.26425.128"
      # Mirrors Build:TestFilter in purview-build.json: the SDK categorises unit test projects as Unit,
      # so the WSLC integration suites are never selected and the runner needs no WSLC host.
      test-filter: "/*/*/*/*[Category=Unit]"
      # All eight library projects are packable, so pack and validate the produced packages.
      run-pack: true
      validate-pack: true
    secrets: inherit

  # The shared pipeline filters to [Category=Unit] because the WSLC integration suites need a Windows
  # host. The Docker integration suites need only a Docker daemon, so they run here on the same Linux
  # runner a consumer would use - the standing proof that the library and every service module work off
  # Windows/WSL. The suites skip themselves when no daemon is reachable, so a non-zero result is a real
  # failure, not a missing runtime.
  integration-docker:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Keep in sync with `sdk.version` in global.json.
          dotnet-version: "11.0.100-rc.1.26425.128"
      - name: Docker backend
        run: dotnet test src/tests/Docker.IntegrationTests/Docker.IntegrationTests.csproj --configuration Release --treenode-filter '/*/*/*/*'
      - name: Service modules on Docker
        run: dotnet test src/tests/Modules.DockerIntegrationTests/Modules.DockerIntegrationTests.csproj --configuration Release --treenode-filter '/*/*/*/*'
